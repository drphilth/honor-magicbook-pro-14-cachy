# HONOR FMB-P: KWin only parses CTA-861 EDID blocks, and this panel declares its HDR
# in a DisplayID block, so KWin reports the internal panel as HDR-incapable. Feed the kernel
# a corrected EDID that carries the same HDR data in a CTA-861 block as well.
KERNEL_CMDLINE[default]+="drm.edid_firmware=eDP-1:edid/honor-fmbp-hdr.bin"
