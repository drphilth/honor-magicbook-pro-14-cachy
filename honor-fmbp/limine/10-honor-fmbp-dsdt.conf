# HONOR MagicBook Pro 14 2025 (FMB-P) — corrected ACPI DSDT (OEM revision 0x03).
#
# The stock firmware DSDT aborts at load time (NFC0 calls GNUM/GINF), killing the rest of
# the namespace build: the TOUCHPAD and TOUCHSCREEN nodes are never created. (Storage is
# NOT affected -- verified on kernel 7.1.3: the NVMe and its partitions enumerate fine with
# the stock table. This is an input fix, not a boot fix.) The corrected table also adds the
# PowerResource/_PR0 the OEM omitted from the FTSC1000 touchscreen.
#
# limine-entry-tool converts each initrd= into a Limine module_path emitted BEFORE the
# main initramfs, which is exactly what the kernel's acpi_table_upgrade() requires (it
# only scans the leading uncompressed cpio). limine-snapper-sync additionally copies the
# override into limine_history/ content-addressed by hash, so snapshot/rollback entries
# keep the DSDT they were created with — otherwise a rollback would come up with no touchpad.
#
# The referenced file is (re)built on the ESP by honor-fmbp-dsdt-update(8).
#
# This is a package-owned drop-in: /etc/default/limine belongs to the user and must not
# be edited by us.
KERNEL_CMDLINE[default]+="initrd=/acpi_override.img"
