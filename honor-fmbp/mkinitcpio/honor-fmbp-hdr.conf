# HONOR FMB-P: the patched HDR EDID must be readable when i915 probes in early boot.
#
# Guarded: the blob is generated from the LIVE panel at install time (never shipped), and the
# generator can legitimately decline (not an FMB-P, no eDP-1, panel already carries CTA-861
# HDR). An unconditional FILES+=() on a missing file fails `mkinitcpio -P` for EVERY kernel —
# i.e. the next kernel update leaves the machine unbootable. Been there.
if [[ -e /usr/lib/firmware/edid/honor-fmbp-hdr.bin ]]; then
    FILES+=(/usr/lib/firmware/edid/honor-fmbp-hdr.bin)
fi
